<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Offline</title><style>body{font:16px system-ui;background:#f4f6fb;color:#24304a;margin:0}main{max-width:1000px;margin:32px auto;padding:24px;background:white;border-radius:16px}button,input,textarea,select{font:inherit;padding:9px;margin:4px}button{cursor:pointer;background:#465eea;color:white;border:0;border-radius:8px}textarea{width:98%;min-height:110px}section{border-bottom:1px solid #ddd;padding:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(max-width:650px){main{margin:8px;padding:14px}.grid{grid-template-columns:1fr}}</style><main><h1>Quiz Offline</h1><p>Đề và cấu hình lưu trên trình duyệt này. Xuất file HTML để học sinh làm offline.</p><section><input id="title" placeholder="Tên đề"><input id="doc" type="file" accept=".docx"><button onclick="importDoc()">Nhập Word</button><button onclick="add()">Thêm câu</button></section><section><select id="savedExams"><option value="">Đề đã lưu</option></select><button onclick="openSaved()">Mở đề</button><button onclick="newExam()">Đề mới</button><button onclick="cloneExam()">Nhân bản</button><button onclick="deleteExam()">Xóa đề</button></section><div id="qs"></div><section><button onclick="save()">Lưu đề</button><button onclick="backup()">Xuất JSON</button><input id="json" type="file" accept=".json" onchange="restore(event)"><button onclick="exportHtml()">Xuất HTML offline</button><label>Thời gian (phút)<input id="mins" type="number" min="0" value="0"></label></section><section><h2>Kết quả</h2><input id="results" type="file" accept=".json" multiple><button onclick="excel()">Xuất Excel</button></section><small id="msg"></small></main><script src="/quiz-core.js"></script><script src="/mammoth.browser.min.js"></script><script src="/xlsx.full.min.js"></script><script>
let questions=[];try{questions=JSON.parse(localStorage.getItem('quiz.questions')||'[]');if(!Array.isArray(questions))questions=[]}catch{}document.getElementById('title').value=localStorage.getItem('quiz.title')||'Bài ôn tập';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){qs.innerHTML=questions.map((q,i)=>`<section><b>Câu ${i+1}</b><button onclick="questions.splice(${i},1);draw()">Xóa</button><textarea oninput="questions[${i}].text=this.value">${esc(q.text)}</textarea><div class="grid">${q.options.map((o,j)=>`<label><input type="radio" name="a${i}" ${q.answer===j?'checked':''} onchange="questions[${i}].answer=${j}"><input value="${esc(o)}" oninput="questions[${i}].options[${j}]=this.value"></label>`).join('')}</div><label>Đáp án (chỉ số 0-3) <input type="number" min="0" max="3" value="${q.answer||0}" oninput="questions[${i}].answer=+this.value"></label></section>`).join('')}function add(){questions.push({text:'',options:['','','',''],answer:0});draw()}async function importDoc(){try{let f=doc.files[0];if(!f)throw Error('Chọn file Word .docx trước.');let r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{convertImage:mammoth.images.imgElement(x=>x.read('base64').then(b=>({src:'data:'+x.contentType+';base64,'+b})))});let lines=new DOMParser().parseFromString(r.value,'text/html').body.innerText.split(/\n+/).map(x=>x.trim()).filter(Boolean),cur=null;for(let line of lines){let m=line.match(/^([A-D])[.)]\s*(.*)$/i);if(m&&cur){cur.options[m[1].toUpperCase().charCodeAt(0)-65]=m[2];if(/[＊*]$/.test(m[2]))cur.answer=m[1].toUpperCase().charCodeAt(0)-65}else{if(cur)questions.push(cur);cur={text:line,options:['','','',''],answer:0}}}if(cur)questions.push(cur);draw();msg.textContent='Đã đọc nội dung Word. Hãy rà soát câu hỏi và đáp án trước khi lưu.'}catch(e){msg.textContent='Không thể nhập Word: '+e.message}}function save(){try{localStorage.setItem('quiz.questions',JSON.stringify(questions));localStorage.setItem('quiz.title',title.value);msg.textContent='Đã lưu trên trình duyệt này.'}catch(e){msg.textContent='Không thể lưu: '+e.message}}function download(n,s,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('quiz-backup.json',JSON.stringify({version:1,id:currentExamId,title:title.value,questions},null,2),'application/json')}async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());if(!d||d.version!==1||!Array.isArray(d.questions))throw Error('Sai định dạng');questions=d.questions;title.value=d.title||'Bài ôn tập';draw();save()}catch(x){msg.textContent='Không nhập được JSON: '+x.message}}function exportHtml(){let data=JSON.stringify({title:title.value,questions,mins:+mins.value||0}).replace(/</g,'\\u003c');let html='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>'+esc(title.value)+'</title><style>body{font:18px system-ui;max-width:800px;margin:24px auto;padding:12px}button{padding:10px}label{display:block;padding:8px}</style><h1>'+esc(title.value)+'</h1><div id="app"></div><script type="application/json" id="data">'+data+'</scr'+'ipt><script>(function(){let d=JSON.parse(document.querySelector("#data").textContent),a=document.querySelector("#app"),ans={};a.innerHTML=d.questions.map((q,i)=>`<fieldset><legend>${q.text}</legend>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${o}</label>`).join("")}</fieldset>`).join("")+"<button id=submit>Nộp bài</button><div id=result></div>";submit.onclick=()=>{let score=0;d.questions.forEach((q,i)=>{let x=document.querySelector(`[name=q${i}]:checked`);if(x&&+x.value===q.answer)score++});result.textContent=`Kết quả: ${score}/${d.questions.length}`;let r=JSON.parse(localStorage.getItem("quiz.results")||"[]");r.push({title:d.title,score,total:d.questions.length,date:new Date().toISOString()});try{localStorage.setItem("quiz.results",JSON.stringify(r))}catch(e){result.textContent+=" (trình duyệt không lưu được kết quả)"}let b=new Blob([JSON.stringify(r[r.length-1],null,2)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="ket-qua.json";l.textContent=" Tải kết quả";result.append(l)}})()<\/script>';download('de-on-tap.html',html,'text/html')}async function excel(){try{let files=[...results.files],rows=[];for(let f of files){let d=JSON.parse(await f.text());rows.push(...(Array.isArray(d)?d:[d]))}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Ket qua');XLSX.writeFile(wb,'ket-qua.xlsx')}catch(e){msg.textContent='Không xuất được: '+e.message}}draw();
let pendingImport=false;let currentExamId='';try{currentExamId=localStorage.getItem('quiz.currentExamId')||''}catch{}let dirty=false;function refreshSaved(){let sel=document.getElementById('savedExams');if(!sel)return;let keep=currentExamId;sel.innerHTML='<option value="">Đề đã lưu</option>';try{for(const e of JSON.parse(localStorage.getItem('quiz.exams')||'[]')){let o=document.createElement('option');o.value=e.id;o.textContent=e.title;sel.appendChild(o)}}catch{}sel.value=keep}window.newExam=function(){if(dirty&&!confirm('Bỏ thay đổi chưa lưu?'))return;currentExamId='';questions=[];title.value='Bài ôn tập mới';draw();dirty=false};window.openSaved=function(){let e=JSON.parse(localStorage.getItem('quiz.exams')||'[]').find(x=>x.id===savedExams.value);if(!e)return;currentExamId=e.id;questions=JSON.parse(JSON.stringify(e.questions));title.value=e.title;draw();dirty=false};window.cloneExam=function(){if(!questions.length){msg.textContent='Chưa có đề để nhân bản.';return}currentExamId='';title.value=title.value+' - Bản sao';dirty=true;msg.textContent='Đã tạo bản sao chưa lưu.'};window.deleteExam=function(){let id=savedExams.value||currentExamId;if(!id){msg.textContent='Chọn đề đã lưu trước.';return}let all=JSON.parse(localStorage.getItem('quiz.exams')||'[]'),e=all.find(x=>x.id===id);if(!e)return;if(!confirm('Xóa đề “'+e.title+'” khỏi trình duyệt này?'))return;localStorage.setItem('quiz.exams',JSON.stringify(all.filter(x=>x.id!==id)));if(currentExamId===id)newExam();refreshSaved();msg.textContent='Đã xóa đề.'};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});document.addEventListener('input',e=>{if(e.target.closest('#qs')||e.target.id==='title')dirty=true});window.importDoc=async function(){try{let f=doc.files[0];if(!f||!f.name.toLowerCase().endsWith('.docx'))throw Error('Chọn file .docx hợp lệ.');let r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{convertImage:mammoth.images.imgElement(x=>x.read('base64').then(b=>({src:'data:'+x.contentType+';base64,'+b})))});let parsed=QuizCore.parseWordHtml(r.value);questions=questions.concat(parsed.questions);draw();msg.textContent=`Nhận diện ${parsed.questions.length} câu; ${parsed.questions.filter(q=>q.answer<0).length} câu thiếu đáp án. ${parsed.warnings.join(' ')}`}catch(e){msg.textContent='Không thể nhập Word: '+e.message}};
window.save=function(){try{let normalized=QuizCore.validateExam({title:title.value,questions});let db=JSON.parse(localStorage.getItem('quiz.exams')||'[]');if(!currentExamId)currentExamId=normalized.id;normalized.id=currentExamId;let ix=db.findIndex(x=>x.id===normalized.id);if(ix<0)db.push(normalized);else{if(pendingImport&&!confirm('Đề cùng ID đã có. Ghi đè đề đã lưu?'))return;db[ix]=normalized;}pendingImport=false;localStorage.setItem('quiz.exams',JSON.stringify(db));localStorage.setItem('quiz.currentExamId',currentExamId);localStorage.setItem('quiz.questions',JSON.stringify(normalized.questions));localStorage.setItem('quiz.title',normalized.title);questions=normalized.questions;dirty=false;refreshSaved();msg.textContent='Đã lưu đề trên trình duyệt này.'}catch(e){msg.textContent='Không thể lưu: '+e.message}};
window.restore=async function(e){try{let d=JSON.parse(await e.target.files[0].text());let normalized=QuizCore.validateExam(d);questions=normalized.questions;currentExamId=normalized.id;pendingImport=true;title.value=normalized.title;draw();dirty=true;msg.textContent='Đã nhập đề hợp lệ. Nhấn Lưu đề để lưu.'}catch(x){msg.textContent='Không nhập được JSON; dữ liệu cũ được giữ nguyên. '+x.message}};
window.exportHtml=function(){try{let ex=QuizCore.validateExam({title:title.value,questions});download('de-on-tap.html',QuizCore.standalone(ex),'text/html;charset=utf-8');msg.textContent='Đã tạo HTML độc lập.'}catch(e){msg.textContent='Chưa thể xuất đề: '+e.message}};
window.excel=async function(){let rows=[],seen=new Set(),errors=[];for(const f of results.files){try{let raw=JSON.parse(await f.text()),list=Array.isArray(raw)?raw:[raw];for(const x of list){let r=QuizCore.result(x);if(seen.has(r.attemptId)){errors.push(f.name+': trùng lượt '+r.attemptId);continue}seen.add(r.attemptId);rows.push({'STT':rows.length+1,'Họ tên':r.student.name,'Lớp':r.student.className,'Tên đề':r.examTitle,'ID đề':r.examId,'Điểm':r.score,'Số câu đúng':r.correctCount,'Tổng số câu':r.totalQuestions,'Thời điểm nộp':r.submittedAt,'ID lượt làm bài':r.attemptId})}}catch(e){errors.push(f.name+': '+e.message)}}if(!rows.length){msg.textContent='Không có kết quả hợp lệ. '+errors.join(' | ');return}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Ket qua');XLSX.writeFile(wb,'ket-qua.xlsx');msg.textContent=`Đã xuất ${rows.length} lượt. ${errors.join(' | ')}`};refreshSaved();</script></html>
